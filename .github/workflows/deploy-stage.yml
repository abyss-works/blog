name: Deploy Staging

on:
  push:
    branches: [dev]
    paths-ignore:
      - "k8s/**"
      - "**.md"

jobs:
  build-and-deploy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          TAG="git-${GITHUB_SHA::7}"
          docker build -t "registry.abyssworks.dev/blog:${TAG}" .
          docker tag "registry.abyssworks.dev/blog:${TAG}" "registry.abyssworks.dev/blog:latest"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Push to registry
        run: |
          docker push "registry.abyssworks.dev/blog:${TAG}"
          docker push "registry.abyssworks.dev/blog:latest"

      - name: Update kustomization tag
        run: |
          sed -i "s|newTag:.*|newTag: ${TAG}|" k8s/stage/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/stage/kustomization.yaml
          git commit -m "ci: bump stage image to ${TAG}"
          git push
