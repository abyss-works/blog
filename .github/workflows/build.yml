name: Build

on:
  push:
    branches: [dev]
    paths-ignore:
      - "k8s/**"
      - "**.md"

concurrency:
  group: build-dev
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push image
        run: |
          TAG="git-${GITHUB_SHA::7}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:${TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "TAG=${TAG}" >> "${GITHUB_ENV}"

      - name: Update image tag
        run: |
          sed -i "s|newTag:.*|newTag: ${TAG}|" k8s/prod/kustomization.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add k8s/prod/kustomization.yaml
          git commit -F - <<EOF
          ci(k8s): 이미지 태그를 ${TAG}로 갱신

          - k8s/prod/kustomization.yaml: blog 이미지 태그를 ${TAG}로 지정한다.
          EOF
          git pull --rebase origin dev
          git push origin HEAD:dev
